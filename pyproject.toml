[project]
name = "autoclaim"
version = "0.1.0"
description = "Deterministic multi-agent harness that adjudicates auto physical-damage insurance claims."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# Dependencies are added step by step (`uv add ...`) as each step needs them,
# so CI stays fast and every dependency has a reason to exist.
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "kaggle>=1.7",
    "scikit-learn>=1.5",
    "catboost>=1.2",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "interpret-core>=0.6",
    "httpx>=0.27",
    "faiss-cpu>=1.8",
    "fastembed>=0.4",
    "networkx>=3.3",
    "rank-bm25>=0.2.2",
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "pyreadstat>=1.2",
    "judgekit",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
    "pandas-stubs>=3.0.5.260914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoclaim"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "live_llm: hits a real LLM API; never run in CI",
    "requires_data: needs downloaded data in data/; auto-skipped when absent",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["kaggle.*", "sklearn.*", "catboost.*", "joblib.*", "lightgbm.*", "xgboost.*", "interpret.*",
          "faiss.*", "fastembed.*", "networkx.*", "rank_bm25.*", "pyreadstat.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scripts.*", "eval.*", "tests.*"]
strict = false
disallow_untyped_defs = false

[tool.uv.sources]
judgekit = { path = "../JudgeKit", editable = true }
