[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#f6f7fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2937"
font = "sans serif"

[server]
address = "127.0.0.1"  # this laptop only: no Wi-Fi or public address
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"  # no developer Deploy button
