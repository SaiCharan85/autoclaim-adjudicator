# Labeled queries for the retrieval benchmark. Written to resemble what the coverage node asks.
# relevant: clauses a correct coverage decision must see (2-5 ids).
# direct:   subset of relevant that a good search should find from the query text alone; the rest
#           should be reachable through policy-graph edges (1-2 hops) from a direct clause.
queries:
  - id: q01
    query: "Deer ran onto the highway at night and hit the front of the car; bumper and headlight damaged."
    relevant: [INS-COMPREHENSIVE, DEF-COLLISION]
    direct: [INS-COMPREHENSIVE]
  - id: q02
    query: "Rear-ended at a red light by another car, trunk and bumper crushed."
    relevant: [INS-COLLISION, DEF-COLLISION, LIM-DEDUCTIBLE]
    direct: [INS-COLLISION, DEF-COLLISION, LIM-DEDUCTIBLE]
  - id: q03
    query: "Is a loss under the deductible paid?"
    relevant: [LIM-LOSS-BELOW-DEDUCTIBLE, DEF-DEDUCTIBLE]
    direct: [LIM-LOSS-BELOW-DEDUCTIBLE, DEF-DEDUCTIBLE]
  - id: q04
