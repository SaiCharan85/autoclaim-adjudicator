# Auto physical-damage fraud red flags, written in our own words from general industry knowledge.
# No third-party publication text is reproduced here.
#
# A red flag is a reason to look closer, never proof of fraud. Weights are our own judgment of
# how strongly each flag should raise attention; they are combined with a noisy-OR in [0, 1].
#
# Fields use the shared rule vocabulary: the simulator's FNOL feature names. The real 1994–96 data
# is translated into the same names where it can be (lines/auto/datasets.py: legacy_canonical);
# rules it cannot express are reported as unchecked, not as "no red flag".
# Honesty note: the same author wrote these rules and the simulator's fraud mechanisms, so the
# simulator alone can't validate them. That's why the real-label report exists.

name: auto_physical_damage_red_flags
version: "2.0"
rules:
  - id: loss_soon_after_inception
    description: The loss happened within about two weeks of the policy starting.
    weight: 0.35
    all_of:
      - {field: days_policy_to_loss, op: le, value: 15}

  - id: claim_soon_after_inception
    description: The claim was filed within about two weeks of the policy starting.
    weight: 0.30
    all_of:
      - {field: days_policy_to_claim, op: le, value: 15}

  - id: recent_address_change
    description: The policyholder changed address within six months before the claim.
    weight: 0.35
    all_of:
      - {field: address_change_days, op: le, value: 180}

  - id: unverified_at_fault_loss
    description: >-
      The policyholder was at fault and nothing independent backs up the story:
      no police report and no witness.
    weight: 0.10
    all_of:
      - {field: at_fault, op: eq, value: 1}
      - {field: police_report, op: eq, value: 0}
      - {field: witness_count, op: eq, value: 0}

  - id: isolated_unverified_loss
    description: The loss happened in a rural area with no police report and no witness.
    weight: 0.15
    all_of:
      - {field: area, op: eq, value: rural}
      - {field: police_report, op: eq, value: 0}
      - {field: witness_count, op: eq, value: 0}

  - id: claim_near_vehicle_value
    description: >-
      The amount claimed for a repairable loss is close to what the whole car is worth.
    weight: 0.15
    all_of:
      - {field: claim_to_acv, op: ge, value: 0.6}
      - {field: cause, op: not_in, value: [theft, fire]}

  - id: delayed_reporting
    description: The claim was reported roughly a month or more after the loss.
    weight: 0.20
    all_of:
      - {field: notice_days, op: ge, value: 28}

  - id: late_night_unwitnessed_loss
    description: The loss happened between midnight and 5 a.m. with no witness and no police report.
    weight: 0.15
    all_of:
      - {field: loss_hour, op: in, value: [0, 1, 2, 3, 4]}
      - {field: witness_count, op: eq, value: 0}
      - {field: police_report, op: eq, value: 0}

  - id: out_of_state_loss
    description: The loss happened in a different state from where the policy is written.
    weight: 0.10
    all_of:
      - {field: out_of_state, op: eq, value: 1}

  - id: financed_theft_reported_late
    description: A financed car was reported stolen to police a day or more after the loss.
    weight: 0.30
    all_of:
      - {field: cause, op: eq, value: theft}
      - {field: financed, op: eq, value: 1}
      - {field: police_report_hours, op: ge, value: 24}

  - id: early_attorney_on_injury_claim
    description: An attorney is already involved in an injury claim at first notice.
    weight: 0.15
    all_of:
      - {field: attorney_involved, op: eq, value: 1}
      - {field: injury_count, op: ge, value: 1}
